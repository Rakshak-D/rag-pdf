name: Product pull request checks

on:
  pull_request:
    branches:
      - feat/product-rebuild-06-user-first-simplification
  push:
    branches:
      - feat/product-rebuild-06-user-first-simplification

permissions:
  contents: read

concurrency:
  group: product-pr-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-checks:
    name: Backend tests and Python static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken-cache
    steps:
      - name: Check out product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.22"

      - name: Install pinned backend CI dependencies
        run: python -m pip install --no-input -r scripts/requirements-browser-ci.txt -r scripts/requirements-product-ci.txt

      - name: Cache pinned tokenizer data before offline tests
        run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"

      - name: Run deterministic backend tests
        run: >-
          python -m pytest -p no:cacheprovider -q
          tests/unit/test_api_schemas.py
          tests/unit/test_local_gateway.py
          tests/unit/test_bm25.py
          tests/unit/test_context_contracts.py
          tests/unit/test_fusion_engine.py
          tests/unit/test_index_inventory.py
          tests/unit/test_index_writer_lease.py
          tests/unit/test_ingestion_chunking.py
          tests/unit/test_manifest.py
          tests/unit/test_model_lifecycle.py
          tests/unit/test_paths_and_fingerprint.py
          tests/unit/test_retrieval_contracts.py
          tests/unit/test_run_plans.py
          tests/unit/test_general_chat.py
          tests/unit/test_generation_contracts.py
          tests/integration/test_general_chat_api.py

      - name: Ruff — reject new findings against recorded baseline
        run: |
          python -m unittest discover -s scripts/tests -p test_ruff_baseline.py -v
          python scripts/check_ruff_baseline.py

  frontend-checks:
    name: Frontend tests, typecheck and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      npm_config_audit: "false"
      npm_config_fund: "false"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"

      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete frontend unit suite
        run: npm test -- --reporter=dot

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build

  nasa-pdfjs-highlight-accuracy:
    name: NASA PDF.js highlight accuracy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      npm_config_audit: "false"
      npm_config_fund: "false"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.22"

      - name: Install pinned PDF fixture generator
        run: python -m pip install --no-input -r ../scripts/requirements-pdfjs-fixtures.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"

      - name: Install locked frontend and Playwright dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the Chromium revision matched to Playwright
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Run offline NASA PDF.js highlight checks
        run: node node_modules/playwright/cli.js test --config playwright.highlight.config.ts

      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nasa-pdfjs-highlight-failure-${{ github.run_id }}
          path: |
            frontend/test-results/nasa-highlight/**
            frontend/test-results/nasa-pdfjs-highlight-measurements.json
          if-no-files-found: ignore
          retention-days: 7

  real-local-document-viewer:
    name: Real local PDF document viewer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.22"

      - name: Install pinned local-service runtime dependencies
        run: python -m pip install --no-input -r ../scripts/requirements-browser-ci.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"

      - name: Install locked frontend and Playwright dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the Chromium revision matched to Playwright
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Test local-service readiness probe
        run: python -m unittest scripts.tests.test_local_pdf_service_stack -v
        working-directory: ${{ github.workspace }}

      - name: Verify the real isolated local PDF service and viewer
        run: node node_modules/playwright/cli.js test --config playwright.local-document-service.config.ts

      - name: Preserve local-service browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-pdf-viewer-failure-${{ github.run_id }}
          path: frontend/test-results/local-document-service/**
          if-no-files-found: ignore
          retention-days: 7
