name: Product pull request checks

on:
  pull_request:
    branches:
      - feat/product-rebuild-06-user-first-simplification
  push:
    branches:
      - feat/product-rebuild-06-user-first-simplification

permissions:
  contents: read

concurrency:
  group: product-pr-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-checks:
    name: Backend tests and Python static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.22"

      - name: Install pinned backend CI dependencies
        run: python -m pip install --no-input -r scripts/requirements-browser-ci.txt -r scripts/requirements-product-ci.txt

      - name: Run deterministic backend tests
        run: >-
          python -m pytest -p no:cacheprovider -q
          tests/unit/test_api_schemas.py
          tests/unit/test_local_gateway.py
          tests/unit/test_bm25.py
          tests/unit/test_context_contracts.py
          tests/unit/test_fusion_engine.py
          tests/unit/test_index_inventory.py
          tests/unit/test_index_writer_lease.py
          tests/unit/test_ingestion_chunking.py
          tests/unit/test_manifest.py
          tests/unit/test_model_lifecycle.py
          tests/unit/test_paths_and_fingerprint.py
          tests/unit/test_retrieval_contracts.py
          tests/unit/test_run_plans.py

      - name: Check backend and supporting Python code with Ruff
        run: python -m ruff check --target-version py310 --select E4,E7,E9,F backend scripts

  frontend-checks:
    name: Frontend tests, typecheck and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      npm_config_audit: "false"
      npm_config_fund: "false"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"

      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run complete frontend unit suite
        run: npm test -- --reporter=dot

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build production frontend
        run: npm run build
