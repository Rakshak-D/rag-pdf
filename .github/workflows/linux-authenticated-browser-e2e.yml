name: Linux authenticated browser acceptance

on:
  push:
    branches:
      - production-evaluation-workbench
    paths:
      - ".github/workflows/linux-authenticated-browser-e2e.yml"
      - "backend/**"
      - "frontend/e2e/**"
      - "frontend/src/**"
      - "frontend/playwright.config.ts"
      - "frontend/vite.config.ts"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "notebooks/config.py"
      - "scripts/authenticated_browser_e2e_linux.py"
      - "scripts/requirements-browser-ci.txt"
      - "tests/unit/test_authenticated_browser_launcher_linux.py"

permissions:
  contents: read

concurrency:
  group: linux-authenticated-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authenticated-browser:
    name: Synthetic authenticated workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      npm_config_audit: "false"
      npm_config_fund: "false"
    steps:
      - name: Check out development branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10.22"

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"

      - name: Install pinned synthetic backend and test dependencies
        run: python -m pip install --no-input -r scripts/requirements-browser-ci.txt

      - name: Install frontend lockfile into temporary copy
        shell: bash
        run: |
          set -euo pipefail
          frontend_copy="$RUNNER_TEMP/rag-pdf-frontend"
          test ! -e "$frontend_copy"
          cp -a frontend "$frontend_copy"
          printf 'registry=https://registry.npmjs.org/\nignore-scripts=true\n' > "$frontend_copy/.npmrc"
          cd "$frontend_copy"
          npm ci --ignore-scripts --no-audit --no-fund --cache "$RUNNER_TEMP/npm-cache"
          echo "RAG_E2E_FRONTEND_COPY=$frontend_copy" >> "$GITHUB_ENV"

      - name: Verify preinstalled runner Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          test -n "$browser"
          test -x "$browser"
          version="$("$browser" --version)"
          printf '%s\n' "$version"
          echo "E2E_BROWSER_EXECUTABLE_PATH=$browser" >> "$GITHUB_ENV"
          echo "E2E_BROWSER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Run focused launcher and browser-selection tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -p no:cacheprovider \
            tests/unit/test_authenticated_browser_launcher_linux.py -q
          cd "$RAG_E2E_FRONTEND_COPY"
          npm test -- --reporter=dot src/test/browser-selection.test.ts
          npm run typecheck
          npm run build

      - name: Execute the three authenticated browser scenarios once
        shell: bash
        run: |
          set -euo pipefail
          evidence_parent="$RUNNER_TEMP/rag-pdf-linux-e2e"
          mkdir -p "$evidence_parent"
          python scripts/authenticated_browser_e2e_linux.py \
            --frontend-dir "$RAG_E2E_FRONTEND_COPY" \
            --evidence-dir "$evidence_parent/evidence"

      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-authenticated-browser-evidence
          path: ${{ runner.temp }}/rag-pdf-linux-e2e/evidence/
          if-no-files-found: ignore
          retention-days: 7
