<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A static, interactive RAG-PDF conversation and source-reading design proof.">
  <title>RAG-PDF · Curiosity</title>
  <link rel="preload" href="assets/fonts/Newsreader-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/InstrumentSans-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/IBM-Plex-Mono-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="assets/reading-desk.css">
</head>
<body data-state="first-run">
  <a class="skip-link" href="#thread">Skip to conversation</a>
  <header class="topbar">
    <a class="wordmark" href="?state=first-run" aria-label="RAG-PDF home">RAG-PDF</a>
    <div class="model-status" id="model-status" role="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="status-label">Model ready</span>
    </div>
  </header>

  <main id="app" class="app-shell">
    <section id="thread" class="thread" aria-label="Conversation" aria-live="off"></section>
  </main>

  <form id="composer" class="composer" aria-label="Question composer">
    <div id="attachment-row" class="attachment-row" hidden>
      <span class="attachment-mark" aria-hidden="true">PDF</span>
      <span id="attachment-name" class="attachment-name" aria-live="polite"></span>
      <button id="open-selected-sample" class="open-selected-sample" type="button" hidden>Open sample pages</button>
      <button id="remove-attachment" class="remove-attachment" type="button" aria-label="Remove selected PDF">×</button>
    </div>
    <div class="composer-row">
      <button id="attach-button" class="composer-tool" type="button" aria-label="Add PDF" title="Add PDF">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
      <input id="pdf-input" type="file" accept="application/pdf,.pdf" hidden>
      <label class="sr-only" for="question-input">Ask a question</label>
      <textarea id="question-input" rows="1" placeholder="Ask a question" autocomplete="off"></textarea>
      <button id="send-button" class="send-button" type="submit" aria-label="Send question">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <p id="composer-status" class="composer-status" role="status" aria-live="polite"></p>
  </form>

  <aside id="pdf-sheet" class="pdf-sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title" aria-hidden="true" hidden>
    <div class="sheet-toolbar">
      <div class="sheet-heading">
        <span id="sheet-title">Curiosity factsheet</span>
        <span id="page-count" class="page-count" aria-label="Page 2 of 4">2 / 4</span>
      </div>
      <div class="sheet-controls">
        <button id="matches-toggle" class="matches-toggle" type="button" aria-pressed="false">Show matches</button>
        <div class="zoom-controls" aria-label="PDF size controls">
          <button id="zoom-out" class="sheet-control" type="button" aria-label="Zoom out" title="Zoom out">−</button>
          <button id="zoom-in" class="sheet-control" type="button" aria-label="Zoom in" title="Zoom in">+</button>
          <button id="zoom-fit" class="sheet-control fit-control" type="button" aria-label="Fit page" title="Fit page">Fit</button>
        </div>
        <button id="close-sheet" class="sheet-control close-control" type="button" aria-label="Close PDF" title="Close PDF">×</button>
      </div>
    </div>
    <div id="page-viewport" class="page-viewport" tabindex="0" aria-label="PDF page">
      <div id="page-frame" class="page-frame">
        <img id="page-image" src="assets/pages/page-02.png" alt="Page 2 of the NASA Mars Science Laboratory/Curiosity factsheet" width="1105" height="1430">
        <div id="evidence-layer" class="evidence-layer" aria-label="Source passages on this page"></div>
      </div>
    </div>
    <div class="page-strip" aria-label="Reading progress">
      <span class="page-thumb" data-page="1"><img src="assets/pages/contact-1.png" alt=""><span>01</span></span>
      <span class="page-thumb" data-page="2"><img src="assets/pages/contact-2.png" alt=""><span>02</span></span>
      <span class="page-thumb" data-page="3"><img src="assets/pages/contact-3.png" alt=""><span>03</span></span>
      <span class="page-thumb" data-page="4"><img src="assets/pages/contact-4.png" alt=""><span>04</span></span>
    </div>
  </aside>

  <script>
    (() => {
      const pageSize = { width: 612, height: 792 };
      const documentKey = "msl-curiosity";
      const sampleFileIdentity = { name: "mars-science-laboratory.pdf", bytes: 1512372, sha256: "2baee40744fc1c35b3ad015f8672a45710ac6bd9124a4041cfc0d7bfba4e10f6" };
      const sourceList = [
        {
          id: "link-caption", page: 2, number: "1", method: "figure", cited: true,
          quote: "A rock outcrop called Link shows signs of being formed by the deposition of water.",
          boxes: [[46.08,217.376,282.285,227.6],[46.08,229.376,74.692,239.6]],
        },
        {
          id: "stream-flow", page: 2, number: "2", method: "words", cited: true,
          quote: "The evidence for stream flow was in rounded pebbles mixed with hardened sand in conglomerate rocks at and near the landing site.",
          boxes: [[44.5,584.66,274.202,596.48],[44.5,600.16,286.421,611.98],[44.5,615.66,133.78,627.48]],
        },
        {
          id: "john-klein-water", page: 2, number: "3", method: "meaning", cited: true,
          quote: "geological and mineralogical evidence for sustained liquid water",
          boxes: [[314.64,139.4,559.882,151.22],[314.64,154.9,547.671,166.72],[314.64,170.4,560.84,182.22],[314.64,185.9,423.73,197.72]],
        },
        {
          id: "touchdown-water", page: 2, number: "", method: "meaning", cited: false,
          quote: "Curiosity touched down right in an area where water once coursed vigorously over the surface.",
          boxes: [[44.5,538.16,289.75,549.98],[44.5,553.66,269.189,565.48],[44.5,569.16,279.422,580.98]],
        },
      ];
      const sourceById = new Map(sourceList.map((source) => [source.id, source]));
      const prompts = [
        "What does Link show?",
        "How many watts at launch?",
        "Which crater and drill target?",
      ];
      const stateFromUrl = new URLSearchParams(location.search).get("state") || "first-run";
      const supportedStates = new Set(["first-run","answered-closed","answered-open","answered-matches","model-missing","reading-progress"]);
      const initialState = supportedStates.has(stateFromUrl) ? stateFromUrl : "first-run";
      const thread = document.getElementById("thread");
      const sheet = document.getElementById("pdf-sheet");
      const evidenceLayer = document.getElementById("evidence-layer");
      const pageImage = document.getElementById("page-image");
      const pageViewport = document.getElementById("page-viewport");
      const pageFrame = document.getElementById("page-frame");
      const pageCount = document.getElementById("page-count");
      const matchesToggle = document.getElementById("matches-toggle");
      const modelStatus = document.getElementById("model-status");
      const statusLabel = document.getElementById("status-label");
      const composer = document.getElementById("composer");
      const questionInput = document.getElementById("question-input");
      const composerStatus = document.getElementById("composer-status");
      const pdfInput = document.getElementById("pdf-input");
      const attachmentRow = document.getElementById("attachment-row");
      const attachmentName = document.getElementById("attachment-name");
      const openSelectedSampleButton = document.getElementById("open-selected-sample");
      const citationTriggers = new Map();
      let activeSource = null;
      let activePage = 2;
      let matchState = false;
      let zoom = 1;
      let selectedFile = null;
      let focusReturn = null;
      let closeTimer = 0;
      let activePopover = null;

      const make = (tag, className, text) => {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      };

      const citation = (source) => {
        const wrap = make("span", "citation-wrap");
        const button = make("button", "citation-chip");
        button.type = "button";
        button.dataset.sourceId = source.id;
        button.setAttribute("aria-label", `Open source ${source.number}, page ${source.page}`);
        button.setAttribute("aria-expanded", "false");
        const marker = make("span", "citation-mark", source.number);
        button.append(marker);
        const popover = make("span", "citation-popover");
        popover.id = `citation-popover-${source.id}`;
        popover.setAttribute("role", "tooltip");
        popover.hidden = true;
        const thumb = document.createElement("img");
        thumb.src = `assets/pages/contact-${source.page}.png`;
        thumb.alt = "";
        thumb.width = 48;
        thumb.height = 62;
        const text = make("span", "popover-copy");
        text.append(make("span", "popover-page", `Page ${source.page}`));
        text.append(make("span", "popover-quote", `“${source.quote}”`));
        popover.append(thumb, text);
        button.setAttribute("aria-describedby", popover.id);
        wrap.append(button, popover);
        button.addEventListener("pointerenter", () => showPopover(wrap));
        button.addEventListener("pointerleave", () => hidePopoverUnlessFocused(wrap));
        button.addEventListener("focus", () => showPopover(wrap));
        button.addEventListener("blur", () => hidePopoverUnlessFocused(wrap));
        button.addEventListener("click", () => openSource(source.id, true));
        citationTriggers.set(source.id, button);
        return wrap;
      };

      const showPopover = (wrap) => {
        if (activePopover && activePopover !== wrap) activePopover.querySelector(".citation-popover").hidden = true;
        activePopover = wrap;
        const popover = wrap.querySelector(".citation-popover");
        const trigger = wrap.querySelector(".citation-chip");
        popover.hidden = false;
        trigger.setAttribute("aria-expanded", "true");
        if (matchMedia("(max-width: 760px)").matches) {
          const triggerRect = trigger.getBoundingClientRect();
          const popoverRect = popover.getBoundingClientRect();
          const gutter = 16;
          const left = Math.max(gutter, Math.min(innerWidth - popoverRect.width - gutter,
            triggerRect.left + triggerRect.width / 2 - popoverRect.width / 2));
          const above = triggerRect.top - popoverRect.height - 10;
          const below = triggerRect.bottom + 10;
          const top = above >= gutter ? above : Math.min(innerHeight - popoverRect.height - gutter, below);
          popover.style.setProperty("--popover-left", `${left}px`);
          popover.style.setProperty("--popover-top", `${Math.max(gutter, top)}px`);
        }
      };

      const hidePopoverUnlessFocused = (wrap) => {
        requestAnimationFrame(() => {
          if (wrap.matches(":hover") || wrap.contains(document.activeElement)) return;
          wrap.querySelector(".citation-popover").hidden = true;
          wrap.querySelector(".citation-chip").setAttribute("aria-expanded", "false");
          if (activePopover === wrap) activePopover = null;
        });
      };

      const hidePopover = () => {
        if (!activePopover) return;
        activePopover.querySelector(".citation-popover").hidden = true;
        activePopover.querySelector(".citation-chip").setAttribute("aria-expanded", "false");
        activePopover = null;
      };

      const addClaim = (parent, text, source) => {
        const paragraph = make("p", "answer-paragraph");
        paragraph.append(document.createTextNode(text), citation(source));
        parent.append(paragraph);
        return paragraph;
      };

      const addFigure = (parent) => {
        const figure = make("figure", "inline-figure");
        const image = document.createElement("img");
        image.src = "assets/figures/link-outcrop.png";
        image.alt = "Curiosity's Mastcam view of the Link rock outcrop on Mars, with rounded pebbles and a one-centimeter scale marker.";
        image.width = 1563;
        image.height = 1011;
        const caption = make("figcaption", "figure-caption");
        caption.append(make("span", "caption-text", "A rock outcrop called Link shows signs of being formed by the deposition of water."));
        caption.append(make("span", "figure-credit", "NASA/JPL-Caltech/MSSS"));
        figure.append(image, caption);
        parent.append(figure);
      };

      const renderFirstRun = (showSuggestions = true, showOpenPdf = false) => {
        const content = make("div", "thread-content first-run-content");
        content.append(make("p", "sample-context", "Curiosity"));
        if (showSuggestions) {
          const choices = make("div", "suggested-questions");
          choices.setAttribute("aria-label", "Suggested questions");
          prompts.forEach((prompt) => {
            const button = make("button", "suggestion", prompt);
            button.type = "button";
            button.addEventListener("click", () => {
              questionInput.value = prompt;
              composerStatus.textContent = "";
              questionInput.focus();
              resizeComposer();
            });
            choices.append(button);
          });
          content.append(choices);
        }
        if (showOpenPdf) {
          const openButton = make("button", "open-sample", "Open PDF");
          openButton.type = "button";
          openButton.addEventListener("click", () => openSamplePdf(openButton));
          content.append(openButton);
        }
        thread.replaceChildren(content);
      };

      const renderAnswered = (question = "What does Link tell us about water on ancient Mars?") => {
        const content = make("div", "thread-content answer-content");
        const user = make("p", "user-message", question);
        const assistant = make("article", "assistant-message");
        assistant.setAttribute("aria-label", "Answer");
        addClaim(assistant, "The page caption says the Link outcrop shows signs of formation by water.", sourceById.get("link-caption"));
        addFigure(assistant);
        addClaim(assistant, "Rounded pebbles in hardened sand within conglomerate rocks were evidence of stream flow.", sourceById.get("stream-flow"));
        addClaim(assistant, "John Klein's sample showed evidence for sustained liquid water.", sourceById.get("john-klein-water"));
        content.append(user, assistant);
        thread.replaceChildren(content);
      };

      const renderState = (state) => {
        document.body.dataset.state = state;
        modelStatus.classList.toggle("is-missing", state === "model-missing");
        statusLabel.textContent = state === "model-missing" ? "Ollama unavailable — start Ollama." : "Model ready";
        if (state === "answered-closed" || state === "answered-open" || state === "answered-matches") {
          renderAnswered();
        } else {
          renderFirstRun(state === "first-run", state === "model-missing");
        }
        if (state === "model-missing") {
          const note = make("p", "model-note", "Open the PDF to read this sample.");
          thread.querySelector(".thread-content").prepend(note);
        }
      };

      const buildEvidenceTargets = () => {
        evidenceLayer.replaceChildren();
        sourceList.forEach((source) => {
          const target = make("div", "evidence-target");
          target.dataset.evidenceTarget = source.id;
          target.dataset.cited = String(source.cited);
          source.boxes.forEach((box) => {
            const [x0,y0,x1,y1] = box;
            const mark = document.createElement("i");
            mark.className = "evidence-mark";
            mark.dataset.pdfBox = box.join(",");
            mark.style.left = `${x0 / pageSize.width * 100}%`;
            mark.style.top = `${y0 / pageSize.height * 100}%`;
            mark.style.width = `${(x1 - x0) / pageSize.width * 100}%`;
            mark.style.height = `${(y1 - y0) / pageSize.height * 100}%`;
            target.append(mark);
          });
          const tag = make("span", "method-tag", source.method);
          const firstBox = source.boxes[0];
          tag.style.left = `${firstBox[0] / pageSize.width * 100}%`;
          tag.style.top = `calc(${firstBox[1] / pageSize.height * 100}% - 18px)`;
          target.append(tag);
          evidenceLayer.append(target);
        });
      };

      const visibleTarget = (sourceId) => {
        evidenceLayer.querySelectorAll(".evidence-target").forEach((target) => {
          target.classList.toggle("is-active", target.dataset.evidenceTarget === sourceId);
        });
        evidenceLayer.dataset.activeTarget = sourceId || "";
      };

      const positionSelectedPassage = (sourceId) => {
        if (!sourceId || activePage !== 2) return;
        requestAnimationFrame(() => {
          const target = [...evidenceLayer.querySelectorAll(".evidence-target")].find((node) => node.dataset.evidenceTarget === sourceId);
          const marks = [...(target?.querySelectorAll(".evidence-mark") || [])];
          const viewport = pageViewport.getBoundingClientRect();
          if (!marks.length || viewport.width <= 0 || viewport.height <= 0) return;
          const rects = marks.map((mark) => mark.getBoundingClientRect());
          const first = Math.min(...rects.map((rect) => rect.top));
          const last = Math.max(...rects.map((rect) => rect.bottom));
          const usableTop = viewport.top + 14;
          const usableBottom = viewport.bottom - 22;
          const centerY = (first + last) / 2;
          const centerX = (Math.min(...rects.map((rect) => rect.left)) + Math.max(...rects.map((rect) => rect.right))) / 2;
          const delta = centerY - (usableTop + usableBottom) / 2;
          const deltaX = centerX - (viewport.left + viewport.width / 2);
          pageViewport.scrollLeft += deltaX;
          pageViewport.scrollTop += delta;
        });
      };

      const positionConversationForSheet = (sourceId) => {
        if (!sourceId || innerWidth > 760) return;
        requestAnimationFrame(() => {
          const chip = citationTriggers.get(sourceId);
          const rect = chip?.getBoundingClientRect();
          if (!rect) return;
          const conversation = document.getElementById("app");
          const targetTop = conversation.getBoundingClientRect().top + (sourceId === "link-caption" ? 14 : 30);
          const delta = rect.top - targetTop;
          if (Math.abs(delta) > 2) conversation.scrollTop += delta;
        });
      };

      const setPage = (page) => {
        activePage = Number(page);
        const src = activePage === 3 ? "assets/pages/page-03.png" : "assets/pages/page-02.png";
        pageImage.src = src;
        pageImage.alt = `Page ${activePage} of the NASA Mars Science Laboratory/Curiosity factsheet`;
        pageCount.textContent = `${activePage} / 4`;
        pageCount.setAttribute("aria-label", `Page ${activePage} of 4`);
        document.querySelectorAll(".page-thumb").forEach((thumb) => {
          if (Number(thumb.dataset.page) === activePage) thumb.setAttribute("aria-current", "page");
          else thumb.removeAttribute("aria-current");
        });
        matchesToggle.hidden = activePage !== 2 || document.body.dataset.state === "model-missing";
        evidenceLayer.hidden = activePage !== 2;
        pageViewport.scrollTop = 0;
        pageViewport.scrollLeft = 0;
        updateZoom();
      };

      const updateZoom = () => {
        const available = Math.max(180, pageViewport.clientWidth - 24);
        const base = Math.min(520, available);
        pageFrame.style.width = `${Math.round(base * zoom)}px`;
        pageViewport.classList.toggle("is-zoomed", zoom > 1.01);
      };

      const setMatches = (enabled) => {
        matchState = Boolean(enabled);
        evidenceLayer.dataset.showMatches = String(matchState);
        matchesToggle.setAttribute("aria-pressed", String(matchState));
        matchesToggle.textContent = matchState ? "Hide matches" : "Show matches";
      };

      const readPreference = () => {
        try { return localStorage.getItem(`rag-pdf:source-sheet:${documentKey}`); }
        catch { return null; }
      };

      const writePreference = (open) => {
        try { localStorage.setItem(`rag-pdf:source-sheet:${documentKey}`, open ? "open" : "closed"); }
        catch { /* The proof still works when storage is unavailable. */ }
      };

      const openSource = (sourceId, explicit = true) => {
        const source = sourceById.get(sourceId);
        if (!source) return;
        hidePopover();
        activeSource = sourceId;
        focusReturn = citationTriggers.get(sourceId) || document.activeElement;
        zoom = matchMedia("(max-width: 760px)").matches ? 2.5 : 1;
        setPage(source.page);
        visibleTarget(source.page === 2 ? sourceId : null);
        sheet.hidden = false;
        sheet.setAttribute("aria-hidden", "false");
        document.body.dataset.pdfOpen = "true";
        clearTimeout(closeTimer);
        requestAnimationFrame(() => {
          sheet.classList.add("is-open");
          updateZoom();
          if (source.page === 2) {
            requestAnimationFrame(() => {
              positionSelectedPassage(sourceId);
              positionConversationForSheet(sourceId);
            });
          }
        });
        if (explicit) writePreference(true);
        if (source.page === 2) {
          const active = evidenceLayer.querySelector(`.evidence-target[data-evidence-target="${sourceId}"]`);
          active?.classList.remove("pulse-once");
          void active?.offsetWidth;
          active?.classList.add("pulse-once");
        }
        if (explicit) document.getElementById("close-sheet").focus({ preventScroll: true });
      };

      const closeSheet = (explicit = true) => {
        if (sheet.hidden) return;
        sheet.classList.remove("is-open");
        sheet.setAttribute("aria-hidden", "true");
        document.body.dataset.pdfOpen = "false";
        if (explicit) writePreference(false);
        clearTimeout(closeTimer);
        closeTimer = window.setTimeout(() => { sheet.hidden = true; }, 220);
        if (focusReturn?.isConnected) requestAnimationFrame(() => focusReturn.focus({ preventScroll: true }));
      };

      const openSamplePdf = (trigger) => {
        activeSource = null;
        focusReturn = trigger;
        setPage(2);
        visibleTarget(null);
        sheet.hidden = false;
        sheet.setAttribute("aria-hidden", "false");
        document.body.dataset.pdfOpen = "true";
        writePreference(true);
        requestAnimationFrame(() => {
          sheet.classList.add("is-open");
          updateZoom();
          document.getElementById("close-sheet").focus({ preventScroll: true });
        });
      };

      const openSelectedSample = () => {
        if (!selectedFile || openSelectedSampleButton.hidden) return;
        activeSource = null;
        focusReturn = openSelectedSampleButton;
        renderState("reading-progress");
        setMatches(false);
        setPage(3);
        visibleTarget(null);
        sheet.hidden = false;
        sheet.setAttribute("aria-hidden", "false");
        document.body.dataset.pdfOpen = "true";
        writePreference(true);
        history.replaceState({}, "", "?state=reading-progress");
        requestAnimationFrame(() => {
          sheet.classList.add("is-open");
          updateZoom();
          document.getElementById("close-sheet").focus({ preventScroll: true });
        });
      };

      const initialSheetPreference = readPreference();
      let defaultOpen = ["answered-open","answered-matches","reading-progress"].includes(initialState) || (initialState === "model-missing" && new URLSearchParams(location.search).get("open") === "1");
      if (initialSheetPreference === "open") defaultOpen = true;
      if (initialSheetPreference === "closed") defaultOpen = false;

      renderState(initialState);
      buildEvidenceTargets();
      document.body.dataset.pdfOpen = "false";
      setMatches(initialState === "answered-matches");
      const initialPage = initialState === "reading-progress" ? 3 : 2;
      setPage(initialPage);
      if (initialState === "answered-open" || initialState === "answered-matches") {
        activeSource = "link-caption";
        visibleTarget(activeSource);
        if (innerWidth <= 760) zoom = 2.5;
      }
      if (defaultOpen) {
        sheet.hidden = false;
        sheet.setAttribute("aria-hidden", "false");
        document.body.dataset.pdfOpen = "true";
        requestAnimationFrame(() => {
          sheet.classList.add("is-open");
          updateZoom();
          if (initialPage === 2 && activeSource) requestAnimationFrame(() => {
            positionSelectedPassage(activeSource);
            positionConversationForSheet(activeSource);
          });
        });
      }

      document.getElementById("close-sheet").addEventListener("click", () => closeSheet(true));
      matchesToggle.addEventListener("click", () => setMatches(!matchState));
      document.getElementById("zoom-in").addEventListener("click", () => { zoom = Math.min(3, zoom + 0.1); updateZoom(); if (activeSource) positionSelectedPassage(activeSource); });
      document.getElementById("zoom-out").addEventListener("click", () => { zoom = Math.max(0.75, zoom - 0.1); updateZoom(); if (activeSource) positionSelectedPassage(activeSource); });
      document.getElementById("zoom-fit").addEventListener("click", () => { zoom = 1; updateZoom(); pageViewport.scrollLeft = 0; pageViewport.scrollTop = 0; });
      window.addEventListener("resize", () => { updateZoom(); if (activeSource) positionSelectedPassage(activeSource); }, { passive: true });
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !sheet.hidden) {
          event.preventDefault();
          closeSheet(true);
        } else if (event.key === "Escape" && activePopover) {
          hidePopover();
        }
      });

      document.getElementById("attach-button").addEventListener("click", () => pdfInput.click());
      const sha256 = async (file) => {
        if (!globalThis.crypto?.subtle) return "";
        const digest = await globalThis.crypto.subtle.digest("SHA-256", await file.arrayBuffer());
        return [...new Uint8Array(digest)].map((value) => value.toString(16).padStart(2, "0")).join("");
      };
      let selectionGeneration = 0;
      const selectFile = async (file) => {
        if (!file) return;
        const generation = ++selectionGeneration;
        selectedFile = null;
        openSelectedSampleButton.hidden = true;
        attachmentRow.hidden = true;
        attachmentName.textContent = "";
        document.body.classList.remove("has-attachment");
        if (!file.name.toLowerCase().endsWith(".pdf") || (file.type && file.type !== "application/pdf")) {
          composerStatus.textContent = "Choose a PDF file.";
          return;
        }
        selectedFile = file;
        attachmentName.textContent = file.name;
        attachmentRow.hidden = false;
        document.body.classList.add("has-attachment");
        openSelectedSampleButton.hidden = true;
        composerStatus.textContent = "";
        if (file.name === sampleFileIdentity.name && file.size === sampleFileIdentity.bytes) {
          try {
            const digest = await sha256(file);
            if (generation === selectionGeneration && selectedFile === file && digest === sampleFileIdentity.sha256) {
              openSelectedSampleButton.hidden = false;
            }
          } catch { /* An unverified local file remains a filename-only selection. */ }
        }
      };
      pdfInput.addEventListener("change", () => selectFile(pdfInput.files?.[0]));
      openSelectedSampleButton.addEventListener("click", openSelectedSample);
      document.getElementById("remove-attachment").addEventListener("click", () => {
        selectedFile = null;
        selectionGeneration += 1;
        pdfInput.value = "";
        attachmentRow.hidden = true;
        document.body.classList.remove("has-attachment");
        openSelectedSampleButton.hidden = true;
        attachmentName.textContent = "";
        document.getElementById("attach-button").focus();
      });
      document.addEventListener("dragover", (event) => {
        if (event.dataTransfer?.types.includes("Files")) event.preventDefault();
      });
      document.addEventListener("drop", (event) => {
        const file = event.dataTransfer?.files?.[0];
        if (!file) return;
        event.preventDefault();
        selectFile(file);
      });

      const resizeComposer = () => {
        questionInput.style.height = "auto";
        questionInput.style.height = `${Math.min(questionInput.scrollHeight, 112)}px`;
      };
      questionInput.addEventListener("input", () => {
        composerStatus.textContent = "";
        resizeComposer();
      });
      questionInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing && !event.nativeEvent?.isComposing) {
          event.preventDefault();
          composer.requestSubmit();
        }
      });
      composer.addEventListener("submit", (event) => {
        event.preventDefault();
        const question = questionInput.value.trim();
        if (!question) return;
        if (question === prompts[0]) {
          renderAnswered(question);
          document.body.dataset.state = "answered-closed";
          questionInput.value = "";
          resizeComposer();
          composerStatus.textContent = "";
          history.replaceState({}, "", "?state=answered-closed");
          document.getElementById("app").scrollTop = 0;
          return;
        }
        composerStatus.textContent = "No sample answer is scripted for this question.";
      });

      window.__setProofState = (state) => {
        if (!supportedStates.has(state)) throw new Error("Unsupported proof state");
        renderState(state);
        activeSource = null;
        setMatches(state === "answered-matches");
        const page = state === "reading-progress" ? 3 : 2;
        setPage(page);
        visibleTarget(null);
        if (state === "answered-open" || state === "answered-matches") {
          activeSource = "link-caption";
          visibleTarget(activeSource);
        }
        return state;
      };
      window.__sources = sourceList.map(({id,page,number,method,cited,quote,boxes}) => ({id,page,number,method,cited,quote,boxes}));
      window.__proofFonts = { answer: "Newsreader", interface: "Instrument Sans", metadata: "IBM Plex Mono" };
    })();
  </script>
</body>
</html>
